name: Build Azzams APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle web dependencies
        run: |
          mkdir -p app/src/main/assets/vendor
          curl -fL --retry 3 -o app/src/main/assets/vendor/firebase-app-compat.js https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js
          curl -fL --retry 3 -o app/src/main/assets/vendor/firebase-database-compat.js https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js
          curl -fL --retry 3 -o app/src/main/assets/vendor/firebase-auth-compat.js https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Azzams-System.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Azzams-System-APK
          path: android-app/app/build/outputs/apk/debug/Azzams-System.apk
          retention-days: 30
