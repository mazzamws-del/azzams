name: Build Azzams APKs

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
      - rebuild/preparation-moderator-review
    paths:
      - 'android-app/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle web dependencies
        run: |
          for DIR in app/src/main/assets/vendor courier/src/main/assets/vendor moderator/src/main/assets/vendor; do
            mkdir -p "$DIR"
            curl -fL --retry 3 -o "$DIR/firebase-app-compat.js" https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js
            curl -fL --retry 3 -o "$DIR/firebase-database-compat.js" https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js
            curl -fL --retry 3 -o "$DIR/firebase-auth-compat.js" https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js
          done

      - name: Verify accounting and region data
        run: cd .. && node tests/open-account.test.cjs && node tests/workspace.test.cjs && node tests/finance.test.cjs && node tests/transactions.test.cjs && node tests/preparation.test.cjs && node tests/analytics.test.cjs && node tests/preparation-batches.test.cjs && node tests/upgrade-2.1.cjs

      - name: Browser tests on isolated fixtures
        timeout-minutes: 6
        working-directory: tests/ui
        run: |
          npm ci
          AZZAMS_CHROMIUM="$(command -v google-chrome || command -v chromium || true)"
          export AZZAMS_CHROMIUM
          if [ -z "$AZZAMS_CHROMIUM" ]; then npx playwright install --with-deps chromium; fi
          timeout 90s node upgrade-2.1.cjs
          TEST_APP=courier timeout 90s node upgrade-2.1.cjs
          timeout 90s node moderator-products.cjs
          timeout 90s node preparation.cjs
          timeout 90s node workspace.cjs
          TEST_APP=moderator timeout 90s node workspace.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-Review-Fixtures
          path: /tmp/azzams-*.png
          retention-days: 3

      - name: Build all APKs
        run: gradle :app:assembleDebug :courier:assembleDebug :moderator:assembleDebug

      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Azzams-System-3.0.1.apk
          python3 ../scripts/build-desktop.py dist/Azzams-System-3.0.1.html
          cp courier/build/outputs/apk/debug/courier-debug.apk dist/Azzams-Courier-2.2.0.apk
          cp moderator/build/outputs/apk/debug/moderator-debug.apk dist/Azzams-Moderator-3.0.0.apk
          sed -i 's#vendor/firebase-app-compat.js#https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js#g' dist/Azzams-System-3.0.1.html
          sed -i 's#vendor/firebase-database-compat.js#https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js#g' dist/Azzams-System-3.0.1.html
          sed -i 's#vendor/firebase-auth-compat.js#https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js#g' dist/Azzams-System-3.0.1.html

      - uses: actions/upload-artifact@v4
        with:
          name: Azzams-System-APK
          path: |
            android-app/dist/Azzams-System-3.0.1.apk
            android-app/dist/Azzams-System-3.0.1.html
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Azzams-Courier-APK
          path: android-app/dist/Azzams-Courier-2.2.0.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Azzams-Moderator-APK
          path: android-app/dist/Azzams-Moderator-3.0.0.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools
          path: |
            /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
            /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign
          retention-days: 3
