name: Build Azzams APKs

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle web dependencies
        run: |
          for DIR in app/src/main/assets/vendor courier/src/main/assets/vendor moderator/src/main/assets/vendor; do
            mkdir -p "$DIR"
            curl -fL --retry 3 -o "$DIR/firebase-app-compat.js" https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js
            curl -fL --retry 3 -o "$DIR/firebase-database-compat.js" https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js
            curl -fL --retry 3 -o "$DIR/firebase-auth-compat.js" https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js
          done

      - name: Build all APKs
        run: gradle :app:assembleDebug :courier:assembleDebug :moderator:assembleDebug

      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Azzams-System-1.10.0.apk
          cp app/src/main/assets/index.html dist/Azzams-System-1.10.0.html
          cp courier/build/outputs/apk/debug/courier-debug.apk dist/Azzams-Courier-1.4.1.apk
          cp moderator/build/outputs/apk/debug/moderator-debug.apk dist/Azzams-Moderator-1.4.1.apk
          sed -i 's#vendor/firebase-app-compat.js#https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js#g' dist/Azzams-System-1.10.0.html
          sed -i 's#vendor/firebase-database-compat.js#https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js#g' dist/Azzams-System-1.10.0.html
          sed -i 's#vendor/firebase-auth-compat.js#https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js#g' dist/Azzams-System-1.10.0.html

      - uses: actions/upload-artifact@v4
        with:
          name: Azzams-System-APK
          path: |
            android-app/dist/Azzams-System-1.10.0.apk
            android-app/dist/Azzams-System-1.10.0.html
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Azzams-Courier-APK
          path: android-app/dist/Azzams-Courier-1.4.1.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Azzams-Moderator-APK
          path: android-app/dist/Azzams-Moderator-1.4.1.apk
          retention-days: 30
